services:
  db:
    image: mariadb:10.11
    container_name: airportcha_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: airportcha_root_password
      MYSQL_DATABASE: airportcha_wp
      MYSQL_USER: airportcha_user
      MYSQL_PASSWORD: airportcha_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: airportcha_wp
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: airportcha_user
      WORDPRESS_DB_PASSWORD: airportcha_password
      WORDPRESS_DB_NAME: airportcha_wp
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/airportcha:/var/www/html/wp-content/themes/airportcha
      - ./wp-content/plugins/airportcha-core:/var/www/html/wp-content/plugins/airportcha-core

volumes:
  db_data:
  wp_core:
